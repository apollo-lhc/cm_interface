name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Official python images instead of setup-python: setup-python cannot
    # install 3.6 on current runners, and CLAUDE.md requires 3.6 compatibility.
    container: python:${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.9", "3.12"]
    steps:
      # Tests import `cm_interface.*`, so the repo must sit in a directory
      # named cm_interface and pytest must run from its parent.
      - uses: actions/checkout@v7
        with:
          path: cm_interface
      - run: pip install flake8 pytest pyserial
      - name: Lint (syntax errors and undefined names only)
        run: flake8 cm_interface --count --select=E9,F63,F7,F82 --show-source --statistics
      # `python -m` puts the cwd (the parent of cm_interface) on sys.path;
      # bare `pytest` does not, and every test module fails to import.
      - run: python -m pytest cm_interface/tests/

  cpp:
    runs-on: ubuntu-latest
    # The EL8 target: the C++ layer embeds the system Python 3.6.
    container: rockylinux:8
    steps:
      - uses: actions/checkout@v7
        with:
          path: cm_interface
      - run: dnf install -y cmake gcc-c++ make python3-devel python3-pyserial
      - name: Build (warnings are errors)
        run: |
          cmake -S cm_interface/cpp -B build -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build
      # No hardware: the port opens lazily, so the first read fails with
      # SerialException. Getting that back as cm::Error (exit 1) shows the
      # interpreter starts, imports cm_interface and translates exceptions.
      - name: Smoke test against a missing tty
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -uo pipefail
          check() {  # check EXPECTED_PYTHON_TYPE LOCATION
            out=$(./build/ff_status_byte "$2" tf /dev/nonexistent 2>&1)
            rc=$?
            echo "$out"
            [[ $rc -eq 1 && "$out" == "error: $1: "* ]] ||
              { echo "expected exit 1 with $1, got exit $rc" >&2; exit 1; }
          }
          check SerialException F1_2
          check KeyError NO_SUCH_FIREFLY
